{{/* required arguments */}}
{{- $recipe_dir := or .recipe_dir "" -}}
{{- $download_dir := or .download_dir "" -}}
{{- $firmware_version := or .firmware_version "" -}}
{{- $kernel_version := or .kernel_version "" -}}
{{- $target_model := or .target_model "" -}}

{{/* optional arguments */}}
{{- $include_all_modules := or .include_all_modules false -}}
{{- $include_module_setup := or .include_module_setup false -}}
{{- $path_modules_list := or .path_modules_list "" -}}
{{- $enable_i2c := or .enable_i2c false -}}
{{- $enable_spi := or .enable_spi false -}}
{{- $enable_wdt := or .enable_wdt false -}}
{{- $enable_sdcard_overclock := or .enable_sdcard_overclock false -}}

{{/* derived variables */}}
{{- $kernel := (printf "%s-%s+" $kernel_version $target_model) -}}
{{- $firmware := (printf "firmware-%s" $firmware_version) -}}
{{- $local_firmware_dir := (printf "%s/%s" $download_dir $firmware ) -}}


architecture: arm64

actions:
  - action: run
    description: Validate required arguments
    command: |
      if [ -z {{ $recipe_dir }} ]; then
        exit 1
      fi
      if [ -z {{ $local_firmware_dir }} ]; then
        exit 1
      fi
      python3 {{ $recipe_dir }}/scripts/check_args.py \
        "{{ $download_dir }}" "{{ $firmware_version }}" "{{ $kernel_version }}" "{{ $target_model }}"

  {{ if $include_all_modules }}
  - action: run
    description: Setup all modules
    chroot: false
    command: |
      mkdir  -p ${ROOTDIR}/lib/modules/{{ $kernel }}/kernel/drivers
      mv {{ $local_firmware_dir }}/modules/{{ $kernel }}/kernel/* ${ROOTDIR}/lib/modules/{{ $kernel }}/kernel/
      cd ${ROOTDIR}/lib/modules/{{ $kernel }}/kernel/drivers
      for file in $(find . -name "*.ko.xz"); do
        xz -d "$file"
      done
      mkdir ${ROOTDIR}/boot/firmware/overlays/
      mv {{ $local_firmware_dir }}/boot/overlays/*.dtbo ${ROOTDIR}/boot/firmware/overlays/
  {{ end }}

  {{ if ne $path_modules_list "" }}
  - action: run
    description: Configure kernel modules using a list
    chroot: false
    command: |
      python3 {{ $recipe_dir }}/scripts/modules/setup_modules.py \
        --source {{ $local_firmware_dir }}/modules/{{ $kernel }}/kernel \
        --destination ${ROOTDIR}/lib/modules/{{ $kernel }} \
        --path-target-modules {{ $path_modules_list }}
  {{ end }}

  {{ if $include_module_setup }}
  - action: run
    description: Transfer kernel module files
    chroot: false
    command: |
      mkdir -p ${ROOTDIR}/lib/modules/{{ $kernel }}
      mv -v {{ $local_firmware_dir }}/modules/{{ $kernel }}/modules.order           ${ROOTDIR}/lib/modules/{{ $kernel }}
      mv -v {{ $local_firmware_dir }}/modules/{{ $kernel }}/modules.builtin         ${ROOTDIR}/lib/modules/{{ $kernel }}
      mv -v {{ $local_firmware_dir }}/modules/{{ $kernel }}/modules.builtin.modinfo ${ROOTDIR}/lib/modules/{{ $kernel }}

  - action: run
    description: Update module dependencies
    chroot: true
    command: |
      depmod -v {{ $kernel }}
  {{ end }}

  {{ if $enable_i2c }}
  - action: run
    description: Set up I2C communication modules
    chroot: false
    command: |
      python3 {{ $recipe_dir }}/scripts/modules/setup_modules.py \
        --source {{ $local_firmware_dir }}/modules/{{ $kernel }}/kernel/drivers \
        --destination ${ROOTDIR}/lib/modules/{{ $kernel }}/drivers \
        i2c/busses/i2c-bcm2835.ko.xz \
        i2c/muxes/i2c-mux-pinctrl.ko.xz \
        i2c/i2c-dev.ko.xz \
        i2c/i2c-mux.ko.xz
  - action: run
    command: |
      echo "dtparam=i2c_arm=on" >> ${ROOTDIR}/boot/firmware/config.txt
      echo "dtparam=i2c_vc=on" >> ${ROOTDIR}/boot/firmware/config.txt
      echo "dtoverlay=i2c-gpio" >> ${ROOTDIR}/boot/firmware/config.txt
  - action: overlay
    source: ../overlays/i2c
  {{ end }}

  {{ if $enable_spi }}
  - action: run
    chroot: false
    command: |
      python3 {{ $recipe_dir }}/scripts/modules/setup_modules.py \
        --source {{ $local_firmware_dir }}/modules/{{ $kernel }}/kernel/drivers \
        --destination ${ROOTDIR}/lib/modules/{{ $kernel }}/drivers \
        spi/spidev.ko.xz \
        spi/spi-bcm2835.ko.xz
      echo "spidev" >> ${ROOTDIR}/etc/modules
      echo "dtparam=spi=on" >> ${ROOTDIR}/boot/firmware/config.txt
  {{ end }}

  {{ if or $enable_i2c $enable_spi }}
  - action: run
    description: Update module dependencies
    chroot: true
    command: |
      depmod -v {{ $kernel }}
  {{ end }}

  {{ if $enable_wdt }}
  - action: overlay
    source: ../overlays/watchdog
  {{ end}}

  {{ if $enable_sdcard_overclock }}
  - action: run
    description: Enable SD card overclock (80 MHz bus + turbo)
    command: |
      echo "initial_turbo=60" >> ${ROOTDIR}/boot/firmware/config.txt
      echo "dtoverlay=sdhost,overclock_50=80" >> ${ROOTDIR}/boot/firmware/config.txt
  - action: run
    description: Install sdhost overlay
    chroot: false
    command: |
      python3 {{ $recipe_dir }}/scripts/firmware/setup_overlays_dtbo.py \
        --source {{ $local_firmware_dir }}/boot/overlays \
        --destination ${ROOTDIR}/boot/firmware/overlays \
        sdhost.dtbo
  {{ end }}
